services:
  postgres:
    image: postgres:16-alpine
    container_name: text_to_sql_postgres
    restart: always
    environment:
      POSTGRES_DB: chinook_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chinook_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
