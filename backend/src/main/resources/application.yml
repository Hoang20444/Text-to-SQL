server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

spring:
  application:
    name: text-to-sql-backend
  # Local secrets are generated by data/scripts/docker_chinook.py into the ignored .local/docker.env.
  # Both paths are optional so the app can run from backend/ or from the repository root.
  config:
    import:
      - optional:file:../.local/docker.env[.properties]
      - optional:file:./.local/docker.env[.properties]
      # Issuer/audience and local account subjects generated by infra/local/oidc.py init.
      - optional:file:../.local/oidc/backend.env[.properties]
      - optional:file:./.local/oidc/backend.env[.properties]
  datasource:
    url: ${METADATA_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/nla_metadata}
    username: ${METADATA_USERNAME:nla_app}
    password: ${METADATA_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false
  jackson:
    deserialization:
      # Unknown request fields are rejected (contract: detect drift, no smuggled SQL/secrets).
      fail-on-unknown-properties: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

nla:
  # Hosts the backend may open warehouse connections to (comma separated).
  allowed-hosts: ${WAREHOUSE_ALLOWED_HOSTS:127.0.0.1,localhost}
  # Root of the repository data/ folder. Empty = auto-detect ./data or ../data.
  data-root: ${NLA_DATA_ROOT:}
  # Registers the three local Chinook warehouses on startup. docker_chinook.py writes
  # CHINOOK_DOCKER=true after the databases are provisioned and verified.
  local-bootstrap: ${CHINOOK_DOCKER:false}
