server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: text-to-sql-backend
  # Local secrets are generated by data/scripts/docker_chinook.py into the ignored .local/docker.env.
  # Both paths are optional so the app can run from backend/ or from the repository root.
  config:
    import:
      - optional:file:../.local/docker.env[.properties]
      - optional:file:./.local/docker.env[.properties]
      # Issuer/audience and local warehouse grants generated by infra/local/oidc.py init.
      - optional:file:../.local/oidc/backend.env[.properties]
      - optional:file:./.local/oidc/backend.env[.properties]
  datasource:
    url: ${METADATA_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/nla_metadata}
    username: ${METADATA_USERNAME:nla_app}
    password: ${METADATA_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  jackson:
    default-property-inclusion: always

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

nla:
  security:
    # Keycloak realm that signs access tokens; the backend only verifies, it stores no passwords.
    issuer-uri: ${OIDC_ISSUER_URI:http://127.0.0.1:8180/realms/nla}
    # Empty = <issuer-uri>/protocol/openid-connect/certs. Set when the backend reaches Keycloak
    # through a different host than the public issuer (e.g. inside Docker).
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
    audience: ${OIDC_AUDIENCE:nla-api}
  # Root of the repository data/ folder (sample provenance files such as data/chinook).
  # Empty = auto-detect ./data or ../data from the working directory.
  data-root: ${NLA_DATA_ROOT:}
  # Registers the three local Chinook warehouses on startup. Enabled by CHINOOK_DOCKER=true,
  # which docker_chinook.py writes after the databases are provisioned and verified.
  local-bootstrap:
    enabled: ${CHINOOK_DOCKER:false}
    # Sample warehouse grants for the local Keycloak accounts (subjects come from
    # .local/oidc/backend.env). ADMIN sees every warehouse without grants; VIEWER only gets
    # PostgreSQL so the "wrong warehouse -> 403" case can be demonstrated.
    access:
      - subject: ${NLA_LOCAL_ANALYST_SUBJECT:}
        warehouses: [wh-chinook-pg, wh-chinook-mysql, wh-chinook-mssql]
      - subject: ${NLA_LOCAL_VIEWER_SUBJECT:}
        warehouses: [wh-chinook-pg]
    warehouses:
      - id: wh-chinook-pg
        name: Chinook (PostgreSQL)
        engine: POSTGRESQL
        host: 127.0.0.1
        port: 55432
        database: nla_chinook
        default-schema: public
        username: nla_reader
        credential-reference: env:NLA_CHINOOK_PG_PASSWORD
        dataset:
          id: ds-chinook-pg
          name: Chinook Music Store
          description: Chinook v1.4.5 sample (11 tables) on PostgreSQL, read-only reader account.
          semantic-file: chinook/semantic-postgresql.json
          tables: [album, artist, customer, employee, genre, invoice, invoice_line, media_type, playlist, playlist_track, track]
      - id: wh-chinook-mysql
        name: Chinook (MySQL)
        engine: MYSQL
        host: 127.0.0.1
        port: ${NLA_MYSQL_PORT:53306}
        database: nla_chinook
        default-schema: nla_chinook
        username: nla_reader
        credential-reference: env:NLA_CHINOOK_MYSQL_PASSWORD
        dataset:
          id: ds-chinook-mysql
          name: Chinook Music Store
          description: Chinook v1.4.5 sample (11 tables) on MySQL, read-only reader account.
          semantic-file: chinook/semantic-mysql.json
          tables: [Album, Artist, Customer, Employee, Genre, Invoice, InvoiceLine, MediaType, Playlist, PlaylistTrack, Track]
      - id: wh-chinook-mssql
        name: Chinook (SQL Server)
        engine: SQL_SERVER
        host: 127.0.0.1
        port: 51433
        database: nla_chinook
        default-schema: dbo
        username: nla_reader
        credential-reference: env:NLA_CHINOOK_MSSQL_PASSWORD
        dataset:
          id: ds-chinook-mssql
          name: Chinook Music Store
          description: Chinook v1.4.5 sample (11 tables) on SQL Server, read-only reader account.
          semantic-file: chinook/semantic-mssql.json
          tables: [Album, Artist, Customer, Employee, Genre, Invoice, InvoiceLine, MediaType, Playlist, PlaylistTrack, Track]
