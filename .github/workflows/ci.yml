# Continuous integration for backend (Java), frontend (React) and AI service (Python).
# Runs on pull requests into main/develop, on every push that lands on main/develop (including a
# direct merge without a PR), and by hand. Feature branches only run CI through their pull request.
# Every run checks all three parts.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Same formatter as docs/code-style.md; fails if a file is not Google Java Format.
      - name: Check formatting
        run: mvn -B -ntp com.spotify.fmt:fmt-maven-plugin:2.25:check

      # Integration tests start PostgreSQL, MySQL and SQL Server with Testcontainers
      # (Docker is available on GitHub-hosted Ubuntu runners). No secrets are needed:
      # tests sign their own JWTs and use throwaway database containers.
      - name: Test
        run: mvn -B -ntp test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Node 22, React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Prettier, as in docs/code-style.md.
      - name: Check formatting
        run: npm run format:check

      # Type check (tsc -b) and production build.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  ai:
    name: AI service (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # requirements-dev.txt includes requirements.txt plus Black and isort.
      - name: Install
        run: python -m pip install -r ai-service/requirements-dev.txt

      # Black and isort settings come from pyproject.toml (line length 100).
      - name: Check formatting
        run: |
          python -m black --check .
          python -m isort --check-only ai-service data/scripts

      # Tests use mocked model providers; no Ollama, API key or network is needed.
      - name: Test
        run: python -m pytest -q ai-service infra/local/test_llm_profile.py
