# Continuous integration. Each part of the repo has its own job so FE and AI jobs can be
# added later without touching the backend job.
name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Same formatter as docs/code-style.md; fails if a file is not Google Java Format.
      - name: Check formatting
        run: mvn -B -ntp com.spotify.fmt:fmt-maven-plugin:2.25:check

      # Integration tests start PostgreSQL, MySQL and SQL Server with Testcontainers
      # (Docker is available on GitHub-hosted Ubuntu runners). No secrets are needed:
      # tests sign their own JWTs and use throwaway database containers.
      - name: Test
        run: mvn -B -ntp test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
